# The two checks a machine can make without a provisioned instance (#39).
#
# Everything here used to be run by hand, on every change, forever — and the one
# guarding that the shipped bundle matches src/ SKIPPED ITSELF whenever
# node_modules was absent, which is the state of a fresh clone. That is exactly
# the machine a check like this should not trust a human to have set up. That
# bundle check is gone with the committed bundle (instalador #34): js/ and css/ are
# build output now, and the machine's check that the build happens at all — and
# that it packs — is the release workflow, on every pull request
# (.github/workflows/release.yml).
#
# What is deliberately NOT here: the rest of scripts/smoke.sh. Those assertions
# need a provisioned Nextcloud with the app enabled, an admin user and an app
# password — a fixture an order of magnitude heavier than PHPUnit, for checks
# whose value is precisely that they run against a REAL instance. They stay
# manual, and README.md says so.
name: CI

# `main` and pull requests, NOT every push. Deliberate, not a narrowing: a commit
# on a feature branch is checked by that branch's pull request, and running both
# would double every run for no extra coverage. The gap it leaves is a branch
# pushed with no pull request open — which is a branch nobody is proposing to
# merge, and `scripts/test.sh` is one command away locally.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    # The suite is typed against OCP and needs intl, so it runs inside the same
    # image the instance runs — the identical arrangement scripts/test.sh uses
    # locally. Pinned to the major this app declares in appinfo/info.xml.
    container: nextcloud:34-apache

    steps:
      - uses: actions/checkout@v4

      # NEXTCLOUD_ROOT is /usr/src/nextcloud and NOT /var/www/html, which is the
      # one thing that differs from running this locally. The image ships the
      # source under /usr/src and the entrypoint copies it into the webroot at
      # container start — and `container:` here never runs that entrypoint, so
      # /var/www/html is empty. Measured, not assumed: tests/bootstrap.php reads
      # this variable for exactly this reason.
      - name: Resolve Nextcloud
        run: |
          test -f /usr/src/nextcloud/3rdparty/autoload.php
          test -d /usr/src/nextcloud/lib/public
          php -m | grep -qx intl

      - name: Fetch PHPUnit
        run: |
          mkdir -p tools
          curl -sSLf -o tools/phpunit.phar https://phar.phpunit.de/phpunit-11.phar

      - name: Run the suite
        env:
          NEXTCLOUD_ROOT: /usr/src/nextcloud
        run: php tools/phpunit.phar

  frontend:
    name: Frontend unit tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      # The pure logic in src/ — the filter options both alert panes share. Three
      # defects of the same kind have shipped (#12, #44): the wrong shape handed to
      # a library component, invisible to PHPUnit and to a reviewer. scripts/layout.sh
      # can see them but needs a provisioned instance, so it has never run here.
      # Vitest reuses the Vite that @nextcloud/vite-config already installs.
      - name: Unit-test the frontend logic
        run: npm test

      # Nothing rebuild-and-require-no-drift here any more: the bundle is ignored
      # build output, so there is no committed copy to drift. The release workflow's
      # pack step builds on every pull request and fails a PR whose build produces no
      # bundle.
